<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#190F3C"/></marker>
    <marker id="ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3746FF"/></marker>
  </defs>
  <!-- Ω+ : partie inférieure du solide -->
  <path d="M90,150 C70,190 60,250 120,272 C170,290 250,280 270,240 C285,205 265,170 250,150 A80,16 0 0 1 90,150 Z"
        fill="#3746FF" fill-opacity="0.12" stroke="#190F3C" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Ω− : partie supérieure (contour corail) -->
  <path d="M90,150 C95,110 105,50 140,42 C172,36 175,80 200,95 C225,110 245,130 250,150 A80,16 0 0 1 90,150 Z"
        fill="#FF808B" fill-opacity="0.22" stroke="none"/>
  <path d="M90,150 C95,110 105,50 140,42 C172,36 175,80 200,95 C225,110 245,130 250,150"
        fill="none" stroke="#FF808B" stroke-width="2.6" stroke-linecap="round"/>
  <!-- surface de coupure : moitié arrière en pointillés, moitié avant en trait plein -->
  <path d="M90,150 A80,16 0 0 1 250,150" fill="none" stroke="#190F3C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M90,150 A80,16 0 0 0 250,150" fill="none" stroke="#190F3C" stroke-width="2.2"/>
  <!-- normale n et vecteur contrainte T -->
  <line x1="165" y1="152" x2="163" y2="98" stroke="#190F3C" stroke-width="2.2" marker-end="url(#fn)"/>
  <text x="146" y="104" font-size="17" fill="#190F3C" font-style="italic" text-decoration="underline">n</text>
  <line x1="165" y1="152" x2="214" y2="117" stroke="#3746FF" stroke-width="2.2" marker-end="url(#ft)"/>
  <text x="218" y="118" font-size="17" fill="#3746FF" font-style="italic" text-decoration="underline">T</text>
  <!-- étiquettes -->
  <path d="M104,162 C98,180 104,194 112,196" fill="none" stroke="#190F3C" stroke-width="1.4"/>
  <text x="116" y="203" font-size="17" fill="#190F3C" font-style="italic">dS</text>
  <path d="M190,70 C210,60 228,56 244,54" fill="none" stroke="#FF808B" stroke-width="1.6"/>
  <text x="248" y="58" font-size="19" fill="#D6455A" font-style="italic">Ω<tspan dy="-8" font-size="12">−</tspan></text>
  <path d="M276,228 C284,222 290,234 298,228" fill="none" stroke="#190F3C" stroke-width="1.4"/>
  <text x="304" y="234" font-size="19" fill="#190F3C" font-style="italic">Ω<tspan dy="-8" font-size="12">+</tspan></text>
</svg>
