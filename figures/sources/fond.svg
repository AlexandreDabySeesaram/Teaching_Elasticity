<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#190F3C"/></marker>
    <marker id="ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3746FF"/></marker>
  </defs>
  <!-- remplissages -->
  <path d="M90,150 C70,190 60,250 120,272 C170,290 250,280 270,240 C285,205 265,170 250,150 A80,16 0 0 1 90,150 Z"
        fill="#3746FF" fill-opacity="0.12"/>
  <path d="M90,150 C110,110 105,50 140,42 C172,36 175,80 200,95 C225,110 235,130 250,150 A80,16 0 0 1 90,150 Z"
        fill="#FF808B" fill-opacity="0.22"/>
  <!-- contour : tangentes continues aux jonctions, couleur franche de chaque côté -->
  <path d="M90,150 C70,190 60,250 120,272 C170,290 250,280 270,240 C285,205 265,170 250,150"
        fill="none" stroke="#190F3C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="butt"/>
  <path d="M250,150 C235,130 225,110 200,95 C175,80 172,36 140,42 C105,50 110,110 90,150"
        fill="none" stroke="#FF808B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="butt"/>
  <!-- surface de coupure -->
  <path d="M90,150 A80,16 0 0 1 250,150" fill="none" stroke="#190F3C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M90,150 A80,16 0 0 0 250,150" fill="none" stroke="#190F3C" stroke-width="2"/>
  <!-- élément de surface dS (dans le plan de coupure) -->
  <ellipse cx="165" cy="153" rx="24" ry="4.8" fill="#190F3C" fill-opacity="0.28" stroke="#190F3C" stroke-width="1"/>
  <!-- normale n : perpendiculaire au plan de coupure, donc verticale -->
  <line x1="165" y1="153" x2="165" y2="96" stroke="#190F3C" stroke-width="2.2" marker-end="url(#fn)"/>
  <!-- repère d'angle droit entre n et dS -->
  <path d="M165,145 L173,145 L173,153.6" fill="none" stroke="#190F3C" stroke-width="1"/>
  <line x1="165" y1="153" x2="214" y2="117" stroke="#3746FF" stroke-width="2.2" marker-end="url(#ft)"/>
  <!-- traits de rappel -->
  <path d="M150,156 C140,175 128,186 118,190" fill="none" stroke="#190F3C" stroke-width="1.2"/>
  <path d="M190,70 C210,60 228,56 244,54" fill="none" stroke="#FF808B" stroke-width="1.6"/>
  <path d="M276,228 C284,222 290,234 298,228" fill="none" stroke="#190F3C" stroke-width="1.4"/>
</svg>
